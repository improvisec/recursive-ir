# /etc/recursive-ir/logstash/pipelines/000-router.conf
input {
  beats {
    port => 15044
    # keep plain; Filebeat already parsed JSON where applicable
    codec => plain { charset => "UTF-8" }
  }
}
filter {
  # Ensure event.original exists for ALL sources that still have message
  if ![event][original] and [message] {
    mutate { copy => { "message" => "[event][original]" } }
  }
  # Default assumption: ingestion timestamp
  if ![timestamp_desc] {
    mutate { add_field => { "timestamp_desc" => "ingestion time" } }
  }
  # Run Dissector ONLY for jsonified artefacts; skip manifests
  if [log][file][path] and [log][file][path] =~ /\/jsonified_artefacts\// {
    dissect {
      mapping => {
        "[log][file][path]" =>
          "/var/log/recursive-ir/cases/%{[case_id]}/hosts/%{[host_ip]}/jsonified_artefacts/%{?atype}/%{?fname}"
      }
      tag_on_failure => []
    }
  }
ruby {
  init => '
    require "json"
    @@case_meta ||= {}   # { cid => {"mtime"=>Integer, "meta"=>Hash} }
  '
  code => '
    cid = event.get("case_id")
    return unless cid.is_a?(String) && !cid.empty?
    path = "/var/log/recursive-ir/cases/#{cid}/case_manifest.json"
    # stat may fail if case folder not created yet
    begin
      st = File.stat(path)
      mtime = st.mtime.to_i
    rescue => e
      return
    end
    entry = @@case_meta[cid]
    meta = nil
    # reload if missing or changed on disk
    if entry.nil? || entry["mtime"] != mtime
      begin
        obj = JSON.parse(File.read(path)) rescue nil
        if obj && obj["case_id"] == cid
          meta = obj
          @@case_meta[cid] = {"mtime" => mtime, "meta" => meta}
          @logger.info("Loaded/Reloaded case manifest for case_id",
            :case_id => cid, :path => path, :mtime => mtime)
        else
          @logger.warn("Invalid or mismatched case_manifest.json",
            :case_id => cid, :path => path)
          @@case_meta.delete(cid)
          return
        end
      rescue => e
        @logger.warn("Failed to load case_manifest.json",
          :case_id => cid, :path => path, :error => e.message)
        @@case_meta.delete(cid)
        return
      end
    else
      meta = entry["meta"]
    end
    return unless meta
    if meta["timezones"].is_a?(Array) && event.get("timezones").nil?
      event.set("timezones", meta["timezones"])
    end
    if meta["customer_id"] && event.get("customer_id").nil?
      event.set("customer_id", meta["customer_id"])
    end
    if meta["customer_name"] && event.get("customer_name").nil?
      event.set("customer_name", meta["customer_name"])
    end
  '
}
  # ------------------------------------------------------------
  # -------------------- PATCH: manifest-specific vs generic fingerprint --------------------
  if [source_type] in ["manifest","artefacts-manifest"] {
    fingerprint {
      source => [
        "[case_id]",
        "[host_ip]",
        "[artefact_type]",
        "[original_filename]",
        "[sha256]",
        "[md5]",
        "[size_bytes]"
      ]
      concatenate_sources => true
      method  => "SHA256"
      key     => "recursive-ir"
      target  => "[@metadata][doc_id]"
    }
  } else {
    ruby {
      init => '
        require "yaml"
        @@parsers_cfg = nil
        @@parsers_mtime = nil
        def resolve_event_field(event, field_name)
          return nil if field_name.nil?
          f = field_name.to_s.strip
          return nil if f.empty?
          path =
            if f.start_with?("[")
              f
            else
              parts = f.split(".").map(&:strip).reject(&:empty?)
              return nil if parts.empty?
              "[" + parts.join("][") + "]"
            end
          event.get(path)
        end
      '
      code => '
        cfg_path = "/etc/recursive-ir/conf/parsers.yml"
        begin
          st = File.stat(cfg_path)
          mtime = st.mtime.to_i
        rescue
          mtime = nil
        end
        if mtime && (@@parsers_cfg.nil? || @@parsers_mtime != mtime)
          begin
            raw = YAML.load_file(cfg_path)
            @@parsers_cfg = raw.is_a?(Hash) ? raw : {}
            @@parsers_mtime = mtime
          rescue
            @@parsers_cfg = {}
            @@parsers_mtime = mtime
          end
        end
        types_cfg = @@parsers_cfg.is_a?(Hash) ? @@parsers_cfg["types"] : nil
        types_cfg = {} unless types_cfg.is_a?(Hash)
        stype = event.get("source_type")
        parser_key = nil
        parser_cfg = nil
        if stype.is_a?(String) && !stype.empty?
          parser_key = stype.sub(/json$/, "")
          parser_cfg = types_cfg[parser_key]
        end
        fp_fields = nil
        if parser_cfg.is_a?(Hash)
          fp_fields = parser_cfg["fingerprint_fields"]
        end
        if !fp_fields.is_a?(Array) || fp_fields.empty?
          fp_fields = ["case_id", "host_ip", "host.name", "host.hostname", "event.original"]
        end
        parts = []
        fp_fields.each do |fname|
          next unless fname
          val = resolve_event_field(event, fname)
          next if val.nil?
          if val.is_a?(Array) || val.is_a?(Hash)
            begin
              val = LogStash::Json.dump(val)
            rescue
              val = val.to_s
            end
          else
            val = val.to_s
          end
          next if val.empty?
          parts << "#{fname}=#{val}"
        end
        event.set("[@metadata][fingerprint_source]", parts.join("|"))
      '
    }
    fingerprint {
      source => ["[@metadata][fingerprint_source]"]
      concatenate_sources => true
      method  => "SHA256"
      key     => "recursive-ir"
      target  => "[@metadata][doc_id]"
    }
  }
  # ----------------------------------------------------------------------------------------
  mutate {
    remove_field => [
      "[agent]",
      "[host][name]",
      "[ecs]",
      "[input]",
      "[log][file][device_id]",
      "[log][file][fingerprint]",
      "[log][file][inode]",
      "[log][offset]",
      "@version",
      "[message]"
    ]
    remove_tag => ["beats_input_codec_plain_applied", "beats_input_raw_event"]
  }
}
output {
  if [source_type] in ["manifest","artefacts-manifest"] {
    pipeline { send_to => "manifest" }
  }
  else if [source_type] == "cloudtrailjson" { pipeline { send_to => "cloudtrailjson" } }
  else if [source_type] == "dissect-evtx-duplicatejson" { pipeline { send_to => "dissect-evtx-duplicatejson" } }
  else if [source_type] == "custom-parser-1json" { pipeline { send_to => "custom-parser-1json" } }
  else if [source_type] == "evtxjson" { pipeline { send_to => "evtxjson" } }
  else if [source_type] == "dissect-evtxjson" { pipeline { send_to => "dissect-evtxjson" } }
  else if [source_type] == "hayabusajson" { pipeline { send_to => "hayabusajson" } }
  else if [source_type] == "mftjson" { pipeline { send_to => "mftjson" } }
  else if [source_type] == "plasojson" { pipeline { send_to => "plasojson" } }
  else if [source_type] == "json-arrayjson" { pipeline { send_to => "json-arrayjson" } }
  else if [source_type] == "json-passthroughjson" { pipeline { send_to => "json-passthroughjson" } }
  else if [source_type] == "nginxjson" { pipeline { send_to => "nginxjson" } }
  else if [source_type] == "csvjson" { pipeline { send_to => "csvjson" } }
  else if [source_type] == "csv-headerlessjson" { pipeline { send_to => "csv-headerlessjson" } }
}
