# pipelines.d/998-ingestion-error.conf
# ------------------------------------------------------------
# DLQ -> OpenSearch ("ingestion-error-*")
# Reads failed events from the "output" pipeline DLQ and indexes
# them into a dedicated index for investigation.
#
# Deterministic _id strategy:
#   Primary: parse ORIGINAL failed OpenSearch target index + id from dlq.reason
#            (:_index=>"..." and :_id=>"..."), then fingerprint (orig_index+orig_id)
#   Fallback: if parsing fails, fingerprint a richer seed (reason + path + case + host)
#             and tag the event with "dlq_fallback_id"
# ------------------------------------------------------------

input {
  dead_letter_queue {
    path           => "/var/lib/recursive-ir/logstash/dead_letter_queue"
    pipeline_id    => "output"
    commit_offsets => true
  }
}

filter {
  mutate {
    add_tag => ["from_dead_letter_queue","ingestion_error"]
  }
  
  ruby {
    code => '
      orig_source_type = event.get("source_type")
      event.set("[dlq][orig_source_type]", orig_source_type) if orig_source_type
      event.set("source_type", "ingestion-error")
    '
  }

  # Extract DLQ metadata into [dlq] and drop the raw internal object
  ruby {
    code => '
      md = event.get("[dead_letter_queue]") || event.get("[@metadata][dead_letter_queue]") || {}
      if md.is_a?(Hash) && !md.empty?
        %w[reason plugin_id plugin_type pipeline_id index generation offset entry_time].each do |k|
          v = md[k]
          event.set("[dlq][#{k}]", v) unless v.nil?
        end
      else
        event.tag("dlq_meta_missing")
      end

      # Clean up any raw copy if present
      event.remove("[dead_letter_queue]")
    '
  }

  # Parse dlq.reason into structured fields for easier triage
  # ALSO extract orig_index + orig_id from the embedded bulk action snippet.
  ruby {
    code => '
      reason = event.get("[dlq][reason]")
      unless reason.is_a?(String)
        return
      end

      # Extract failing field name
      if reason =~ /failed to parse field \[(?<field>[^\]]+)\]/
        event.set("[dlq][error_field]", $~[:field])
      end

      # Only parse the OpenSearch response section, not the original failed event body
      resp = reason
      if reason =~ /,\s*response:\s*(?<resp>.+)\z/m
        resp = $~[:resp]
      end
      
      if resp =~ /"type"\s*=>\s*"(?<etype>[^"]+)"/
        event.set("[dlq][error_type]", $~[:etype])
      end
      
      if resp =~ /"reason"\s*=>\s*"(?<emsg>[^"]+)"/
        event.set("[dlq][error_message]", $~[:emsg])
      end
      
      em = event.get("[dlq][error_message]")
      if em.is_a?(String)
        if em =~ /Preview of field\x27s value:\s*\x27(?<preview>.*?)\x27/
          event.set("[dlq][error_preview]", $~[:preview])
        end
      end

      # Extract ORIGINAL target index and document id from the action snippet.
      # Support both Ruby hash style (:_id=>"") and newer action format (_id: "")
      if reason =~ /_index:\s*"(?<idx>[^"]+)"/
        event.set("[dlq][orig_index]", $~[:idx])
      elsif reason =~ /:_index=>\"(?<idx>[^\"]+)\"/
        event.set("[dlq][orig_index]", $~[:idx])
      end
      
      if reason =~ /_id:\s*"(?<id>[^"]+)"/
        event.set("[dlq][orig_id]", $~[:id])
      elsif reason =~ /:_id=>\"(?<id>[^\"]+)\"/
        event.set("[dlq][orig_id]", $~[:id])
      end


      if resp =~ /"caused_by"\s*=>\s*\{.*?"reason"\s*=>\s*"(?<cause>[^"]+)"/m
        event.set("[dlq][error_cause]", $~[:cause])
      end
      
      if em.is_a?(String)
        if em =~ /failed to parse field \[(?<field>[^\]]+)\]/
          event.set("[dlq][error_field]", $~[:field])
        elsif em =~ /object mapping for \[(?<field>[^\]]+)\]/
          event.set("[dlq][error_field]", $~[:field])
        elsif em =~ /Field \[(?<field>[^\]]+)\] is a metadata field/
          event.set("[dlq][error_field]", $~[:field])
        elsif em =~ /mapper \[(?<field>[^\]]+)\] cannot be changed from type \[(?<from>[^\]]+)\] to \[(?<to>[^\]]+)\]/
          event.set("[dlq][error_field]", $~[:field])
          event.set("[dlq][error_from_type]", $~[:from])
          event.set("[dlq][error_to_type]", $~[:to])
        end
      end     
 
      ef = event.get("[dlq][error_field]")
      et = event.get("[dlq][error_type]")
      em = event.get("[dlq][error_message]")
      cause = event.get("[dlq][error_cause]")

      summary_msg = cause || em
      
      summary = nil
      if et && ef && summary_msg
        summary = "#{et} on #{ef}: #{summary_msg}"
      elsif et && summary_msg
        summary = "#{et}: #{summary_msg}"
      elsif ef && summary_msg
        summary = "#{ef}: #{summary_msg}"
      elsif summary_msg
        summary = summary_msg
      elsif ef
        summary = ef
      end     

     event.set("[dlq][summary]", summary) if summary
    '
  }

  # ------------------------------------------------------------------
  # Deterministic doc_id for ingestion-error docs
  # Primary: original failed target index+id
  # Fallback: richer seed + tag so it's visible in OSD
  # ------------------------------------------------------------------
  if [dlq][orig_index] and [dlq][orig_id] {
    fingerprint {
      source => [
        "[dlq][orig_index]",
        "[dlq][orig_id]"
      ]
      concatenate_sources => true
      method  => "SHA256"
      key     => "recursive-ir"
      target  => "[@metadata][doc_id]"
    }
  } else if [dlq][reason] {
    mutate { add_tag => ["dlq_fallback_id"] }
    fingerprint {
      source => [
        "[dlq][reason]",
        "[log][file][path]",
        "[case_id]",
        "[host_ip]"
      ]
      concatenate_sources => true
      method  => "SHA256"
      key     => "recursive-ir"
      target  => "[@metadata][doc_id]"
    }
  }

  # Preserve the original failed document_id before replacing it
  ruby {
    code => '
        event.remove("document_id")
    '
  }
  
  # Make the deterministic _id visible/searchable/exportable in OSD
  if [@metadata][doc_id] {
    mutate {
      add_field => {
        "document_id" => "%{[@metadata][doc_id]}"
      }
    }
  }

  # Remove heavy/raw fields you don’t want in the DLQ index
  mutate {
    remove_field => [
      "[message]",
      "[event][original]"
    ]
  }

  # Drop big ECS trees (safe if missing)
  mutate {
    remove_field => [
      "[event]",
      "[host]",
      "[process]",
      "[source]",
      "[destination]",
      "[client]",
      "[server]",
      "[user]",
      "[file]",
      "[registry]",
      "[dll]",
      "[network]",
      "[service]",
      "[observer]",
      "[agent]",
      "[cloud]",
      "[orchestrator]",
      "[container]",
      "[url]",
      "[http]",
      "[dns]",
      "[tls]",
      "[related]",
      "[rule]",
      "[organization]",
      "[winlog]",
      "[Event]",
      "[ExtraFieldInfo]",
      "[Details]"
    ]
  }

  prune {
    whitelist_names => [
      "^@timestamp$",
      "^case_id$",
      "^source_type$",
      "^host_ip$",
      "^tags$",
      "^document_id$",
      "^log$",
      "^log\\.file$",
      "^log\\.file\\.path$",
      "^dlq($|\\.)"
    ]
  }

  # ------------------------------------------------------------
  # Force @timestamp to DLQ ingestion/triage time ("now")
  # (keeps OSD default time ranges useful)
  # ------------------------------------------------------------
  ruby {
    code => '
      orig_ts = event.get("@timestamp")
      event.set("[dlq][orig_timestamp]", orig_ts) if orig_ts
      event.set("@timestamp", LogStash::Timestamp.new(Time.now.utc))
    '
  }
}

output {
  opensearch {
    hosts             => [ "${OS_HOST}" ]
    user              => "${OS_USER}"
    password          => "${OS_PASS}"
    ecs_compatibility => v1
    index             => "ingestion-error-%{+YYYY.MM}"
    document_id       => "%{[@metadata][doc_id]}"
    ssl               => true
    cacert            => "${OS_CACERT}"
    manage_template   => false
    timeout           => 60
  }

  # stdout { codec => rubydebug }  # optional for local debugging
}

