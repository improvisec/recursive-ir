input { pipeline { address => "output" } }

filter {
  if ![case_id]     { mutate { add_field => { "case_id"     => "unknown" } } }
  if ![source_type] { mutate { add_field => { "source_type" => "unknown" } } }


  # ------------------------------------------------------------------
  # Final cleanup for Security Analytics findings
  #
  # Findings are internal normalized projections. Remove Logstash
  # transport artifacts that have no investigative value.
  # ------------------------------------------------------------------
  if [@metadata][security_analytics_finding] {
    ruby {
      code => '
        event.remove("@version")

        log = event.get("[log]")
        if log.is_a?(Hash) && log.empty?
          event.remove("[log]")
        end

        host = event.get("[host]")
        if host.is_a?(Hash) && host.empty?
          event.remove("[host]")
        end
      '
    }
  }

  # ------------------------------------------------------------------
  # Make the deterministic _id visible/searchable/exportable in OSD
  # (OSD can't visualize _id, so we mirror @metadata.doc_id)
  # ------------------------------------------------------------------
  if [@metadata][doc_id] {
    mutate {
      add_field => {
        "document_id" => "%{[@metadata][doc_id]}"
      }
    }
  }

  # Build Add_Enrichment once we know doc_id and (optionally) target_index
  if ![@metadata][security_analytics_finding] and
     !([source_type] in ["case-manifest","host-manifest","artefacts-manifest"]) and
     [@metadata][doc_id] {
    if [@metadata][target_index] {
      mutate {
        add_field => {
          "Add_Enrichment" =>
            "case_id=%{case_id}&index=%{[@metadata][target_index]}&id=%{[@metadata][doc_id]}"
        }
      }
    } else {
      # Fallback: same format as the non-routed output branch
      mutate {
        add_field => {
          "Add_Enrichment" =>
            "case_id=%{case_id}&index=%{source_type}-%{+YYYY.MM}&id=%{[@metadata][doc_id]}"
        }
      }
    }
  }

  # ------------------------------------------------------------------
  # Curate event.summary from columns.yml
  #
  # - Uses /etc/recursive-ir/opensearch-dashboards/columns.yml
  # - Picks types.<source_type>.default_columns
  # - Builds event.summary as "Field=value | Field=value | ..."
  # - Caches YAML and reloads only when file changes
  # ------------------------------------------------------------------
  ruby {
    code => '
      require "yaml"

      # Findings build their compact summary in the dedicated findings
      # pipeline. Preserve the existing summary logic for normal events.
      return if event.get("[@metadata][security_analytics_finding]")

      # ---- config ----
      path = "/etc/recursive-ir/opensearch-dashboards/columns.yml"
      max_fields = 10  # tune: how many fields to include in summary

      # fields we never want in summary (even if in columns.yml)
      skip = {
        "tags" => true,
        "event.comments.last" => true,
        "event.comments.count" => true,
        "event.comments.history" => true,
        "Add_Enrichment" => true,
        "document_id" => true,
        "case_id" => true,
        "source_type" => true,
        "@timestamp" => true,
        "event_summary" => true,

      }

      # Convert dotted field path (OSD style) into Logstash fieldref
      # "Event.System.EventID" => "[Event][System][EventID]"
      def dotted_to_ref(s)
        s = s.to_s.strip
        return "" if s.empty?
        # already fieldref?
        return s if s.start_with?("[") && s.include?("]")
        parts = s.split(".").map { |p| p.strip }.reject(&:empty?)
        parts.map { |p| "[#{p}]" }.join
      end

      # Format values compactly
      def fmt(v)
        return nil if v.nil?
        if v.is_a?(Array)
          v = v.compact
          return nil if v.empty?
          return v.first.to_s if v.length == 1
          # keep it short
          return v.take(3).map(&:to_s).join(", ") + (v.length > 3 ? "…" : "")
        end
        if v.is_a?(Hash)
          # too big / noisy; skip
          return nil
        end
        s = v.to_s
        s = s.gsub(/\s+/, " ").strip
        return nil if s.empty?
        # trim long strings
        return s.length > 120 ? (s[0,117] + "…") : s
      end

      # ---- cached load of columns.yml ----
      begin
        mtime = File.exist?(path) ? File.mtime(path).to_i : 0

        @@ri_cols_cache ||= nil
        @@ri_cols_mtime ||= 0

        if @@ri_cols_cache.nil? || mtime > @@ri_cols_mtime
          raw = File.read(path)
          y = YAML.safe_load(raw) rescue YAML.load(raw)
          @@ri_cols_cache = y.is_a?(Hash) ? y : {}
          @@ri_cols_mtime = mtime
        end

        cols = @@ri_cols_cache
      rescue => e
        cols = {}
      end

      st = event.get("source_type").to_s.strip
      st = "unknown" if st.empty?

      # Pull default_columns for this source_type
      types = cols.is_a?(Hash) ? (cols["types"] || {}) : {}
      entry = types.is_a?(Hash) ? (types[st] || {}) : {}
      default_cols = entry.is_a?(Hash) ? (entry["default_columns"] || []) : []
      default_cols = [] unless default_cols.is_a?(Array)

      # Build summary segments
      segs = []
      default_cols.each do |field|
        f = field.to_s.strip
        next if f.empty?
        next if skip[f]

        ref = dotted_to_ref(f)
        next if ref.empty?

        v = event.get(ref)
        s = fmt(v)
        next if s.nil?

        # Use full field path as label
        label = f.to_s.strip
        segs << "#{label}=#{s}"
        break if segs.length >= max_fields

      end

      # Fallbacks if columns.yml yields nothing useful
      if segs.empty?
        fallback = [
          "event.blob_preview.event_original"
        ]
        fallback.each do |f|
          ref = dotted_to_ref(f)
          v = event.get(ref)
          s = fmt(v)
          next if s.nil?
        
          label = f.to_s          # ✅ full field name, not last token
          segs << "#{label}=#{s}"
          break if segs.length >= 3
        end
      end

      summary = segs.join(" | ")
      if !summary.to_s.empty?
        # write under [event][summary]
        event.set("event_summary", summary) 
      end
    '
  }

  # ------------------------------------------------------------------
  # Derive per-timezone timestamps from final @timestamp
  # ------------------------------------------------------------------
  ruby {
    code => '
      tzs = event.get("timezones")
      t   = event.get("@timestamp")

      return unless t && tzs.is_a?(Array) && !tzs.empty?

      base = t.time.utc

      offsets = {
        "UTC"  => "+00:00",
        "GMT"  => "+00:00",

        "AEDT" => "+11:00",
        "AEST" => "+10:00",
        "ACST" => "+09:30",
        "ACDT" => "+10:30",
        "AWST" => "+08:00",
        "NZST" => "+12:00",
        "NZDT" => "+13:00",

        "EST"  => "-05:00",
        "EDT"  => "-04:00",
        "CST"  => "-06:00",
        "CDT"  => "-05:00",
        "MST"  => "-07:00",
        "MDT"  => "-06:00",
        "PST"  => "-08:00",
        "PDT"  => "-07:00",
        "AKST" => "-09:00",
        "AKDT" => "-08:00",
        "HST"  => "-10:00",

        "WET"  => "+00:00",
        "WEST" => "+01:00",
        "BST"  => "+01:00",
        "CET"  => "+01:00",
        "CEST" => "+02:00",
        "EET"  => "+02:00",
        "EEST" => "+03:00",
        "MSK"  => "+03:00",

        "IST"  => "+05:30",
        "PKT"  => "+05:00",
        "WIB"  => "+07:00",
        "WITA" => "+08:00",
        "WIT"  => "+09:00",
        "JST"  => "+09:00",
        "KST"  => "+09:00",
        "HKT"  => "+08:00",
        "SGT"  => "+08:00",
        "PHT"  => "+08:00"
      }

      tzs.each do |tz|
        tz_norm = tz.to_s.strip.upcase
        offset  = offsets[tz_norm]
        next unless offset

        field_name = "timestamp_#{tz_norm}"

        existing = event.get(field_name)
        if existing && tz_norm != "UTC" && tz_norm != "GMT" && existing.to_s.end_with?("+00:00")
          # allow overwrite of previously-wrong UTC-looking values
        elsif existing
          next
        end

        local_time = base.getlocal(offset)

        # IMPORTANT: do NOT .utc here, or you undo the offset
        display = base.getlocal(offset).strftime("%Y-%m-%d %H:%M:%S")

        event.set(field_name, display)
      end
    '
  }

  # ------------------------------------------------------------------
  # Cleanup: drop empty tags arrays so OSD treats them as "no tags"
  # ------------------------------------------------------------------
  ruby {
    code => '
      tags = event.get("tags")
      if tags.is_a?(Array) && tags.empty?
        event.remove("tags")
      end
    '
  }

  # ------------------------------------------------------------------
  # Security Analytics mirror branch
  #
  # - Enabled per source type in security_analytics.yml
  # - Keeps the authoritative event unchanged
  # - Creates a clone whose @timestamp is the replay/ingestion time
  # - Keeps only the original event data, with @timestamp changed
  #   to the replay/ingestion time on the clone
  # ------------------------------------------------------------------
  ruby {
    init => '
      require "yaml"
      @@ri_sa_cfg ||= {}
      @@ri_sa_cfg_mtime ||= -1
    '
    code => '
      config_path = "/etc/recursive-ir/conf/security_analytics.yml"
      source_type = event.get("source_type").to_s.strip

      return if source_type.empty?
      return if event.get("[@metadata][security_analytics_finding]")
      return if [
        "case-manifest",
        "host-manifest",
        "artefacts-manifest",
        "security-analytics-findings"
      ].include?(source_type)

      begin
        mtime = File.exist?(config_path) ? File.mtime(config_path).to_i : 0

        if @@ri_sa_cfg_mtime != mtime
          if mtime > 0
            raw = File.read(config_path)
            parsed = YAML.safe_load(raw) rescue YAML.load(raw)
            @@ri_sa_cfg = parsed.is_a?(Hash) ? parsed : {}
          else
            @@ri_sa_cfg = {}
          end
          @@ri_sa_cfg_mtime = mtime
        end
      rescue => e
        @logger.warn("Failed to load Security Analytics configuration",
          :path => config_path, :error => e.message)
        @@ri_sa_cfg = {}
      end

      types = @@ri_sa_cfg["types"]
      types = {} unless types.is_a?(Hash)

      source_cfg = types[source_type]
      source_cfg = {} unless source_cfg.is_a?(Hash)

      detector_id = source_cfg["detector_id"].to_s.strip
      return if detector_id.empty?

      mirror = event.clone
      mirrored_at = LogStash::Timestamp.now
      original_timestamp = event.get("@timestamp")

      return unless original_timestamp

      mirror.set("[@metadata][security_analytics_mirror]", true)
      mirror.set("[@metadata][security_analytics_mirror_index]", "sa-#{source_type}-#{mirrored_at.time.utc.strftime("%Y.%m")}")

      # Keep the mirror focused on detection. Preserve the original parsed
      # event fields plus only the correlation fields needed to resolve a
      # finding back to the authoritative event.
      mirror.remove("[recursive_ir][security_analytics]")
      mirror.set(
        "[recursive_ir][security_analytics][original_timestamp]",
        original_timestamp
      )
      mirror.remove("Add_Enrichment")
      mirror.remove("event_summary")
      mirror.remove("timestamp_candidates")
      mirror.remove("timestamp_desc")
      mirror.remove("_ts_source")
      mirror.remove("__ts_kind_dbg")
      mirror.remove("__ts_norm_dbg")
      mirror.remove("__ts_norm_class")
      mirror.remove("timezones")
      mirror.remove("[event][original]")
      mirror.remove("[event][blob_preview]")
      mirror.remove("[event][blob_hash]")
      mirror.remove("[event][blobs]")
      mirror.remove("[event][comments]")
      mirror.remove("[log][file]")
      mirror.remove("[file][directory]")
      mirror.remove("[file][parent1]")
      mirror.remove("[file][parent2]")
      mirror.remove("[file][parent3]")

      # Remove rendered timezone fields such as timestamp_UTC and
      # timestamp_AWST while leaving the source event timestamp fields.
      mirror.to_hash.keys.each do |key|
        mirror.remove(key) if key.to_s =~ /^timestamp_[A-Z]{2,5}$/
      end

      mirror.set("@timestamp", mirrored_at)

      new_event_block.call(mirror)
    '
  }

}

output {
  if [@metadata][security_analytics_finding] {
    opensearch {
      hosts             => [ "${OS_HOST}" ]
      user              => "${OS_USER}"
      password          => "${OS_PASS}"
      ecs_compatibility => v1
      index             => "security-analytics-findings-%{+YYYY.MM}"
      document_id       => "%{[@metadata][doc_id]}"
      action            => "index"
      ssl               => true
      cacert            => "${OS_CACERT}"
      manage_template   => false
      timeout           => 60
    }
  } else if [@metadata][security_analytics_mirror] {
    opensearch {
      hosts             => [ "${OS_HOST}" ]
      user              => "${OS_USER}"
      password          => "${OS_PASS}"
      ecs_compatibility => v1
      index             => "%{[@metadata][security_analytics_mirror_index]}"
      document_id       => "%{[@metadata][doc_id]}"
      action            => "index"
      ssl               => true
      cacert            => "${OS_CACERT}"
      manage_template   => false
      timeout           => 60
    }
  } else if [@metadata][target_index] {
    opensearch {
      hosts             => [ "${OS_HOST}" ]
      user              => "${OS_USER}"
      password          => "${OS_PASS}"
      ecs_compatibility => v1
      index             => "%{[@metadata][target_index]}"
      document_id       => "%{[@metadata][doc_id]}"
      action            => "index"
      ssl               => true
      cacert            => "${OS_CACERT}"
      manage_template   => false
      timeout           => 60
    }
  } else {
    opensearch {
      hosts             => [ "${OS_HOST}" ]
      user              => "${OS_USER}"
      password          => "${OS_PASS}"
      ecs_compatibility => v1
      index             => "%{source_type}-%{+YYYY.MM}"
      document_id       => "%{[@metadata][doc_id]}"
      action            => "index"
      ssl               => true
      cacert            => "${OS_CACERT}"
      manage_template   => false
      timeout           => 60
    }
  }

  # Optional debug:
  # stdout { codec => rubydebug }
}
