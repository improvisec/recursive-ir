# Security Analytics findings
# ------------------------------------------------------------------

input {
  pipeline {
    address => "security-analytics-findings"
  }
}

filter {
  # Mark this event so the common output pipeline uses the dedicated
  # Security Analytics findings output branch.
  mutate {
    add_field => {
      "[@metadata][security_analytics_finding]" => "true"
    }

    # Findings are already normalized Recursive-IR projections.
    # Remove redundant/internal transport metadata.
    remove_field => [
      "[event][original]",
      "[log][file]",
      "@version"
    ]
  }

  # Position the finding beside the original evidence rather than at
  # the replay/detection time. For multi-event findings, anchor the
  # finding at the earliest related source-event timestamp.
  ruby {
    code => '
      related = event.get("[related_events]")
      earliest = nil

      if related.is_a?(Array)
        related.each do |ref|
          next unless ref.is_a?(Hash)

          ts = ref["timestamp"]
          next if ts.nil? || ts.to_s.empty?

          begin
            parsed = LogStash::Timestamp.parse_iso8601(ts.to_s)
            earliest = parsed if earliest.nil? || parsed < earliest
          rescue
            # Leave timestamp selection to the normal ingestion-time
            # fallback if no related-event timestamp can be parsed.
          end
        end
      end

      if earliest
        event.set("@timestamp", earliest)
        event.set("timestamp_desc", "original event time")
      end
    '
  }

  # Stable finding identity.
  # case_id is included because one native finding may be split into
  # separate per-case projections by the collector.
  fingerprint {
    source => [
      "[case_id]",
      "[detector][id]",
      "[finding][id]"
    ]
    concatenate_sources => true
    method => "SHA256"
    key => "recursive-ir"
    target => "[@metadata][doc_id]"
  }

  # Remove empty host object if Filebeat/ECS left one behind.
  ruby {
    code => '
      host = event.get("[host]")
      if host.is_a?(Hash) && host.empty?
        event.remove("[host]")
      end
    '
  }
}

output {
  pipeline {
    send_to => "output"
  }
}
