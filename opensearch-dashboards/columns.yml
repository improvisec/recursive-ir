global:
  default_columns:
types:
  evtxjson:
    default_columns:
      - Event.System.Computer
      - Event.System.Channel
      - "Event.System.Provider.#attributes.Name"
      - Event.System.Provider
      - Event.System.EventID
  hayabusajson:
    default_columns:
      - Computer
      - Level
      - RuleTitle
  mftjson:
    default_columns:
      - File_Name
      - Parent_Dir
      - Full_Path
      - is_deleted
      - is_dir
      - entry_type
  plasojson:
    default_columns:
      - parser
  json-arrayjson:
    default_columns:
  dissect-evtxjson:
    default_columns:
  nginxjson:
    default_columns:
      - request_method
      - request_path
      - source.ip
      - source.geo.country_name
  cloudtrailjson:
    default_columns:
      - eventName
      - userIdentity.accessKeyId
      - resources.ARN
  json-passthroughjson:
    default_columns:
  csvjson:
    default_columns:
  csv-headerlessjson:
    # Columns listed here become the initial set of columns in Discover
    # for csv-headerlessjson-*.
    default_columns: []
